<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="./resources/fontawesome-all.min.css">
    <link rel="stylesheet" href="./resources/photon-geocoder-autocomplete.min.css">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <style>
        html, body {
            background-color: #ffffff;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        .ol-control > * {
            background-color: #f8f8f8 !important;
            color: #444444 !important;
            border-radius: 0px;
        }

        .ol-attribution a,
        .gcd-gl-input::placeholder,
        .search-layer-input-search::placeholder {
            color: #444444 !important;
        }

        .search-layer-input-search {
            background-color: #f8f8f8 !important;
        }

        .ol-control > *:focus,
        .ol-control > *:hover {
            background-color: rgba(248, 248, 248, 0.7) !important;
        }

        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }
    </style>

    <title>Optimized Route Map</title>
</head>

<body>
    <div id="map">
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>

    <button id="locateBtn"
        style="
            position:absolute;
            top:10px;
            right:10px;
            z-index:2000;
            padding:10px 14px;
            background:#ffffff;
            border:1px solid #999999;
            border-radius:4px;
            cursor:pointer;
            font-size:14px;
            box-shadow:0 1px 4px rgba(0,0,0,0.25);
        ">
        Locate Me
    </button>

    <script src="./resources/qgis2web_expressions.js"></script>
    <script src="./resources/proj4.js"></script>
    <script>
        proj4.defs(
            'EPSG:5234',
            '+proj=tmerc +lat_0=7.00048027777778 +lon_0=80.7717111111111 +k=0.9999238418 +x_0=200000 +y_0=200000 +ellps=evrst30 +towgs84=-97,787,86,0,0,0,0 +units=m +no_defs'
        );
    </script>

    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="./resources/photon-geocoder-autocomplete.min.js"></script>

    <script src="./layers/Kurunduwatta_1.js"></script>
    <script src="./layers/WPKG_1_2.js"></script>
    <script src="./layers/Dematagoda_3.js"></script>
    <script src="./layers/AluthKade_west_4.js"></script>
    <script src="./layers/slaveIsland_5.js"></script>
    <script src="./layers/Thimbirigasyaya_6.js"></script>
    <script src="./layers/optimized_route1optimized_route_7.js"></script>
    <script src="./layers/optimized_visit_points1optimized_visit_points_8.js"></script>

    <script src="./styles/Kurunduwatta_1_style.js"></script>
    <script src="./styles/WPKG_1_2_style.js"></script>
    <script src="./styles/Dematagoda_3_style.js"></script>
    <script src="./styles/AluthKade_west_4_style.js"></script>
    <script src="./styles/slaveIsland_5_style.js"></script>
    <script src="./styles/Thimbirigasyaya_6_style.js"></script>
    <script src="./styles/optimized_route1optimized_route_7_style.js"></script>
    <script src="./styles/optimized_visit_points1optimized_visit_points_8_style.js"></script>

    <script src="./layers/layers.js" type="text/javascript"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <script>
        var userLocationLayer = null;

        document.getElementById("locateBtn").addEventListener("click", function () {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by this browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    var lon = position.coords.longitude;
                    var lat = position.coords.latitude;

                    var userCoords = ol.proj.transform(
                        [lon, lat],
                        'EPSG:4326',
                        map.getView().getProjection()
                    );

                    var userFeature = new ol.Feature({
                        geometry: new ol.geom.Point(userCoords)
                    });

                    userFeature.setStyle(
                        new ol.style.Style({
                            image: new ol.style.Circle({
                                radius: 8,
                                fill: new ol.style.Fill({
                                    color: 'rgba(0, 102, 255, 0.9)'
                                }),
                                stroke: new ol.style.Stroke({
                                    color: '#ffffff',
                                    width: 3
                                })
                            })
                        })
                    );

                    var userSource = new ol.source.Vector({
                        features: [userFeature]
                    });

                    if (userLocationLayer) {
                        map.removeLayer(userLocationLayer);
                    }

                    userLocationLayer = new ol.layer.Vector({
                        source: userSource
                    });

                    map.addLayer(userLocationLayer);

                    map.getView().animate({
                        center: userCoords,
                        zoom: 17,
                        duration: 1000
                    });
                },
                function (error) {
                    if (error.code === 1) {
                        alert("Location access was denied. Please allow location permission.");
                    } else if (error.code === 2) {
                        alert("Location is unavailable.");
                    } else if (error.code === 3) {
                        alert("Location request timed out.");
                    } else {
                        alert("Unable to get your location.");
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });
    </script>
</body>
</html>
